apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-website
  labels:
    app: my-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-website
  template:
    metadata:
      labels:
        app: my-website
    spec:
      containers:
        - name: my-website
          image: tongkung/my-website:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: "128Mi"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP